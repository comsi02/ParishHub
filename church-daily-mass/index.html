<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123a63" />
    <meta name="description" content="천주교 매일미사 주간 성경 말씀 안내" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <title>이번 주 전례 | 런던 한인성당</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="이번 주 전례 첫 화면">
          <span class="cross" aria-hidden="true">✝</span>
          <span><strong>런던 한인성당</strong><small>WEEKLY LITURGY OF THE WORD</small></span>
        </a>
        <a class="source-link" href="https://missa.cbck.or.kr" target="_blank" rel="noreferrer">매일미사 원문 ↗</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">✦ 말씀과 함께하는 한 주</p>
        <h1 id="page-title">이번 주 전례</h1>
        <p id="weekLabel" class="week-label" aria-live="polite">말씀을 불러오는 중입니다.</p>
        <div class="week-controls" aria-label="주간 이동">
          <button id="previousWeek" type="button">← 이전 주</button>
          <button id="todayWeek" type="button" class="today-button">이번 주</button>
          <button id="nextWeek" type="button">다음 주 →</button>
        </div>
      </section>

      <section class="notice" aria-label="안내">
        <span aria-hidden="true">ℹ</span>
        <p>주일 미사의 독서와 복음을 한눈에 확인하세요. 각 날짜를 누르면 한국천주교주교회의 매일미사 원문으로 이동합니다.</p>
      </section>

      <section id="status" class="status" aria-live="polite">공식 매일미사 자료를 불러오는 중입니다.</section>
      <section id="readings" class="readings-grid" aria-label="주간 전례"></section>
    </main>

    <nav class="font-size-menu" aria-label="글씨 크기 선택">
      <div class="font-size-options" role="group" aria-label="글씨 크기 단계">
        <button type="button" data-font-size="grade3" aria-label="G3, 30대용 글씨 크기">G3</button>
        <button type="button" data-font-size="grade4" aria-label="G4, 40대용 글씨 크기">G4</button>
        <button type="button" data-font-size="grade5" aria-label="G5, 50대용 글씨 크기">G5</button>
        <button type="button" data-font-size="grade6" aria-label="G6, 60대용 글씨 크기">G6</button>
        <button type="button" data-font-size="grade7" aria-label="G7+, 70대 이상용 글씨 크기">G7+</button>
      </div>
    </nav>

    <footer>
      <p>성경 말씀 출처: <a href="https://missa.cbck.or.kr" target="_blank" rel="noreferrer">한국천주교주교회의 매일미사</a></p>
      <p>매일미사 © 한국천주교중앙협의회 · 본 서비스는 원문 링크를 제공합니다.</p>
    </footer>
    <dialog id="readingDialog" class="reading-dialog" aria-labelledby="detailTitle">
      <div class="dialog-header">
        <div><p id="detailDate" class="dialog-date"></p><h2 id="detailTitle">전례</h2></div>
        <button id="closeDialog" class="close-dialog" type="button" aria-label="닫기">×</button>
      </div>
      <div id="detailStatus" class="detail-status">말씀 본문을 불러오는 중입니다.</div>
      <div id="detailReadings"></div>
      <a id="detailSource" class="detail-source" href="#" target="_blank" rel="noreferrer">한국천주교주교회의 원문 보기 ↗</a>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
