<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liturgy Control</title>
  <link rel="stylesheet" href="/src/web/styles/base.css">
  <link rel="stylesheet" href="/src/web/styles/control.css">
</head>
<body data-theme="light"> <!-- Control usually better in light mode -->
  <button id="theme-toggle" class="theme-toggle-icon" title="테마 전환">🌓</button>
  <header class="control-header">
    <div class="header-info">
      <div class="mass-selector-group">
        <select id="mass-select" class="mass-select"></select>
        <button id="btn-new-mass" class="btn-new-mass" title="새 전례 생성">+ 새 미사</button>
      </div>
      <span id="slide-counter">0 / 0</span>
    </div>
  </header>  <main class="control-main">
    <div class="left-panel">
      <div class="list-header">
        <h2>슬라이드 목록</h2>
        <div class="list-actions">
          <button id="btn-add-slide" title="슬라이드 추가">+</button>
          <button id="btn-delete-slide" title="슬라이드 삭제">-</button>
        </div>
      </div>
      <ul id="slide-list" class="slide-list">
        <!-- List will be populated by JS -->
      </ul>
    </div>
    <div class="right-panel">
      <div class="preview-container">
        <h2>미리보기</h2>
        <div id="preview-box" class="preview-box">
          <h3 id="preview-title" contenteditable="true" spellcheck="false"></h3>
          <p id="preview-text" contenteditable="true" spellcheck="false"></p>
        </div>
      </div>
      <div class="controls">
        <button id="btn-prev" class="control-btn">이전 (←)</button>
        <button id="btn-next" class="control-btn">다음 (→, Space)</button>
      </div>
    </div>
  </main>
  
  <script type="module" src="/src/web/scripts/control.js"></script>

  <!-- Modal for Creating New Mass -->
  <div id="modal-new-mass" class="modal-overlay hidden">
    <div class="modal-content">
      <h2>새 미사(전례) 만들기</h2>
      <div class="form-group">
        <label for="new-mass-date">날짜</label>
        <input type="date" id="new-mass-date" required>
      </div>
      <div class="form-group">
        <label for="new-mass-title">제목 (예: 연중 제23주일)</label>
        <input type="text" id="new-mass-title" placeholder="미사 제목 입력" required>
      </div>
      <div class="form-group">
        <label for="new-mass-source">복사해올 기존 전례</label>
        <select id="new-mass-source"></select>
      </div>
      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn-secondary">취소</button>
        <button id="btn-modal-create" class="btn-primary">생성하기</button>
      </div>
    </div>
  </div>
</body>
</html>
