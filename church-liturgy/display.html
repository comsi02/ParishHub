<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liturgy Display</title>
  <link rel="stylesheet" href="/src/web/styles/base.css">
  <link rel="stylesheet" href="/src/web/styles/display.css">
  <!-- PptxGenJS: client-side .pptx generation -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <!-- JSZip: PPTX XML post-processing (hanging indent for role symbols) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body data-theme="dark">
  <!-- Display control icon buttons (top-right) -->
  <div class="display-icon-bar">
    <!-- Mass selector -->
    <button id="display-btn-mass-select" class="display-ctrl-btn" title="미사 선택">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
    </button>
    <!-- PPT download (disabled until a mass is loaded) -->
    <button id="display-btn-ppt" class="display-ctrl-btn display-ctrl-ppt" title="PPT 다운로드" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button id="theme-toggle" class="display-ctrl-btn display-ctrl-theme" title="테마 전환">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button id="display-btn-blackout" class="display-ctrl-btn display-ctrl-blackout" title="Display 끄기">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/><line x1="2" y1="3" x2="22" y2="17"/></svg>
    </button>
  </div>

  <!-- Blackout overlay for Display Off mode -->
  <div id="display-mode-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;"></div>

  <div id="slide-container" class="slide-container">
    <div id="loading" class="loading">로딩 중...</div>
    <div id="slide-content" class="slide" style="display: none;">
      <h1 id="slide-title"></h1>
      <div id="slide-contents-container">
        <!-- 10 Content Blocks -->
        <p class="slide-text" data-index="0" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="1" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="2" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="3" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="4" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="5" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="6" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="7" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="8" data-role="none" data-align="left" data-size="normal"></p>
        <p class="slide-text" data-index="9" data-role="none" data-align="left" data-size="normal"></p>
      </div>
    </div>
  </div>

  <!-- ───── Mass Selector Modal ───── -->
  <div id="mass-select-modal" class="mass-modal-overlay mass-modal-hidden" role="dialog" aria-modal="true" aria-labelledby="mass-modal-title">
    <div class="mass-modal-backdrop" id="mass-modal-backdrop"></div>
    <div class="mass-modal-card">
      <div class="mass-modal-header">
        <h2 id="mass-modal-title" class="mass-modal-heading">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          미사 선택
        </h2>
        <button id="btn-close-mass-modal" class="mass-modal-close-btn" title="닫기">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="mass-modal-body" class="mass-modal-body">
        <div class="mass-modal-state">
          <div class="mass-modal-spinner"></div>
          <span>미사 목록 불러오는 중…</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/web/scripts/display.js"></script>
</body>
</html>
